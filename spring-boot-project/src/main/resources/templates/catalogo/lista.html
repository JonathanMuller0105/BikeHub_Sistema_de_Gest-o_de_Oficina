<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Gestão do catálogo | BikeHub</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="main-content"><div class="content-wrapper"><h1>Gestão do catálogo</h1><div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div><a class="btn btn-primary" th:href="@{/catalogo/admin/novo}">Novo item</a><table class="data-table"><thead><tr><th>ID</th><th>Bicicleta</th><th>Tipo</th><th>Valor</th><th>Disponível</th><th>Ações</th></tr></thead><tbody><tr th:each="i:${itens}"><td th:text="${i.id}"></td><td th:text="${i.marca+' '+i.modelo}"></td><td th:text="${i.tipoOperacao}"></td><td th:text="${i.valor}"></td><td th:text="${i.disponivel}"></td><td><a th:href="@{/catalogo/admin/{id}/editar(id=${i.id})}">Editar</a> <a th:href="@{/catalogo/admin/{id}/excluir(id=${i.id})}" onclick="return confirm('Excluir item?')">Excluir</a></td></tr></tbody></table></div></main><script th:src="@{/js/script.js}"></script></body></html>
