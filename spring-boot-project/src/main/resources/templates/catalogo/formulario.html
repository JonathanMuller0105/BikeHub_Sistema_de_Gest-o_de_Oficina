<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Item do catálogo | BikeHub</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="main-content"><div class="content-wrapper"><h1>Item do catálogo</h1><form th:action="@{/catalogo/admin/salvar}" th:object="${item}" method="post" class="unified-form"><input type="hidden" th:field="*{id}"><input class="form-control" th:field="*{marca}" placeholder="Marca" required><input class="form-control" th:field="*{modelo}" placeholder="Modelo" required><input class="form-control" th:field="*{cor}" placeholder="Cor" required><input class="form-control" type="number" th:field="*{ano}" min="1990" required><input class="form-control" type="number" step="0.01" min="0.01" th:field="*{valor}" required><select class="form-control" th:field="*{faixaEtaria}"><option>INFANTIL</option><option>JUVENIL</option><option>ADULTO</option></select><select class="form-control" th:field="*{tipoOperacao}"><option>VENDA</option><option>ALUGUEL</option></select><input class="form-control" th:field="*{imagemUrl}" placeholder="URL da imagem"><textarea class="form-control" th:field="*{descricao}" placeholder="Descrição"></textarea><label><input type="checkbox" th:field="*{disponivel}"> Disponível</label><div class="form-actions"><a class="btn btn-outline" th:href="@{/catalogo/admin}">Cancelar</a><button class="btn btn-primary">Salvar</button></div></form></div></main><script th:src="@{/js/script.js}"></script></body></html>
