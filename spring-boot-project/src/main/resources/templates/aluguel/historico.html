<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico de aluguéis | BikeHub</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="main-content"><div class="content-wrapper"><h1>Contratos e histórico de aluguéis</h1><div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div><div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div><a class="btn btn-outline" th:href="@{/aluguel}">Voltar ao catálogo</a><div class="table-responsive"><table class="data-table"><thead><tr><th>Contrato</th><th>Bicicleta</th><th>Locatário</th><th>Período</th><th>Total</th><th>Status/Ação</th></tr></thead><tbody><tr th:each="a : ${alugueis}"><td th:text="${a.codigoContrato}"></td><td th:text="${a.bicicleta.marca + ' ' + a.bicicleta.modelo}"></td><td th:text="${a.clienteNome}"></td><td th:text="${#temporals.format(a.dataRetirada,'dd/MM/yyyy') + ' a ' + #temporals.format(a.dataDevolucaoPrevista,'dd/MM/yyyy')}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(a.valorTotal,1,2)}"></td><td><span th:text="${a.status}"></span><form th:if="${a.status.name() != 'DEVOLVIDO'}" th:action="@{/aluguel/historico/{id}/devolver(id=${a.id})}" method="post"><input type="number" step="0.01" min="0" name="valorCaucaoDevolvido" th:value="${a.valorCaucao}" required><input type="hidden" name="taxaAvariaOuAtraso" value="0"><button class="btn btn-primary btn-sm" type="submit">Registrar devolução</button></form></td></tr><tr th:if="${#lists.isEmpty(alugueis)}"><td colspan="6">Nenhum aluguel registrado.</td></tr></tbody></table></div></div></main><script th:src="@{/js/script.js}"></script></body></html>
