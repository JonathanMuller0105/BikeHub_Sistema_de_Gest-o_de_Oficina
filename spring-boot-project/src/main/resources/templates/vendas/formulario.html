<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmar venda | BikeHub</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<main class="main-content"><div class="content-wrapper"><h1>Confirmar venda</h1><p th:text="${bicicleta.marca + ' ' + bicicleta.modelo}"></p>
<form th:action="@{/vendas/{id}/finalizar(id=${bicicleta.id})}" method="post" class="unified-form">
<div class="form-grid"><div><label>Nome do comprador</label><input class="form-control" name="clienteNome" required></div><div><label>CPF</label><input class="form-control mascara-cpf" name="clienteCpf" required></div><div><label>Telefone</label><input class="form-control mascara-telefone" name="clienteTelefone" required></div><div><label>E-mail</label><input class="form-control" type="email" name="clienteEmail"></div><div><label>Desconto</label><input class="form-control" type="number" min="0" step="0.01" name="desconto" value="0" required></div><div><label>Pagamento</label><select class="form-control" name="formaPagamento" required><option>PIX</option><option>CARTAO_CREDITO</option><option>CARTAO_DEBITO</option><option>DINHEIRO</option></select></div><div><label>Parcelas</label><input class="form-control" type="number" min="1" name="parcelas" value="1"></div></div>
<div class="form-actions"><a class="btn btn-outline" th:href="@{/vendas}">Cancelar</a><button class="btn btn-primary" type="submit">Registrar venda</button></div></form></div></main><script th:src="@{/js/script.js}"></script></body></html>
