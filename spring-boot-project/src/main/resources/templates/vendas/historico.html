<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico de vendas | BikeHub</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="main-content"><div class="content-wrapper"><h1>Histórico de vendas</h1><div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div><a class="btn btn-outline" th:href="@{/vendas}">Voltar ao catálogo</a><div class="table-responsive"><table class="data-table"><thead><tr><th>ID</th><th>Data</th><th>Bicicleta</th><th>Comprador</th><th>CPF</th><th>Total</th><th>Pagamento</th></tr></thead><tbody><tr th:each="v : ${vendas}"><td th:text="${v.id}"></td><td th:text="${#temporals.format(v.dataVenda,'dd/MM/yyyy')}"></td><td th:text="${v.bicicleta.marca + ' ' + v.bicicleta.modelo}"></td><td th:text="${v.clienteNome}"></td><td th:text="${v.clienteCpf}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(v.valorFinal,1,2)}"></td><td th:text="${v.formaPagamento}"></td></tr><tr th:if="${#lists.isEmpty(vendas)}"><td colspan="7">Nenhuma venda registrada.</td></tr></tbody></table></div></div></main><script th:src="@{/js/script.js}"></script></body></html>
