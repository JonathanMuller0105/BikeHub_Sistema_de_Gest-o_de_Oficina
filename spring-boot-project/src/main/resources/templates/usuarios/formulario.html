<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Usuário | BikeHub</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="main-content"><div class="content-wrapper"><h1 th:text="${usuario.id==null?'Novo usuário':'Editar usuário'}"></h1><form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post" class="unified-form"><input type="hidden" th:field="*{id}"><input class="form-control" th:field="*{nomeCompleto}" placeholder="Nome completo" required><input class="form-control" th:field="*{username}" placeholder="Login" required><input class="form-control" type="password" th:field="*{senha}" placeholder="Senha (vazia mantém a atual)" th:required="${usuario.id==null}"><input class="form-control" type="email" th:field="*{email}" placeholder="E-mail"><input class="form-control" th:field="*{telefone}" placeholder="Telefone"><input class="form-control" th:field="*{cargo}" placeholder="Cargo"><select class="form-control" th:field="*{perfil}" required><option>ADMIN</option><option>MECANICO</option><option>ATENDENTE</option></select><label><input type="checkbox" th:field="*{ativo}"> Ativo</label><div class="form-actions"><a class="btn btn-outline" th:href="@{/usuarios}">Cancelar</a><button class="btn btn-primary">Salvar</button></div></form></div></main><script th:src="@{/js/script.js}"></script></body></html>
