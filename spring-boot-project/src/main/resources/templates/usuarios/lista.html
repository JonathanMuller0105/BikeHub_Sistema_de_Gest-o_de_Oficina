<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Usuários | BikeHub</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="main-content"><div class="content-wrapper"><h1>Administração de usuários</h1><div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div><a class="btn btn-primary" th:href="@{/usuarios/novo}">Novo usuário</a><table class="data-table"><thead><tr><th>ID</th><th>Nome</th><th>Login</th><th>Perfil</th><th>Ativo</th><th>Ações</th></tr></thead><tbody><tr th:each="u:${usuarios}"><td th:text="${u.id}"></td><td th:text="${u.nomeCompleto}"></td><td th:text="${u.username}"></td><td th:text="${u.perfil}"></td><td th:text="${u.ativo}"></td><td><a th:href="@{/usuarios/{id}/editar(id=${u.id})}">Editar</a> <a th:href="@{/usuarios/{id}/excluir(id=${u.id})}" onclick="return confirm('Excluir usuário?')">Excluir</a></td></tr></tbody></table></div></main><script th:src="@{/js/script.js}"></script></body></html>
