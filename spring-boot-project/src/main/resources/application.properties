# ======================================================================
# PROJETO BIKEHUB - ARQUIVO DE CONFIGURAÇÃO DO SPRING BOOT
# Localização: src/main/resources/application.properties
# ======================================================================

# ----------------------------------------------------------------------
# 1. CONFIGURAÇÕES DO SERVIDOR HTTP EMBUTIDO (TOMCAT)
# ----------------------------------------------------------------------
# Porta padrão na qual a aplicação web irá escutar as requisições HTTP
server.port=8080

# Define o encoding padrão das requisições e respostas HTTP para suporte a caracteres em português
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ----------------------------------------------------------------------
# 2. CONFIGURAÇÃO DA CONEXÃO JDBC COM O BANCO DE DADOS MYSQL
# ----------------------------------------------------------------------
# URL de conexão JDBC apontando para o banco de dados 'bikehub' na porta 3306
# Parâmetros:
# - createDatabaseIfNotExist=true: cria o banco automaticamente se ele ainda não existir
# - useSSL=false: desativa SSL para ambiente de desenvolvimento local
# - serverTimezone=America/Sao_Paulo: define o fuso horário brasileiro oficial
# - allowPublicKeyRetrieval=true: permite conexão sem restrições de chave pública no MySQL 8+
spring.datasource.url=jdbc:mysql://localhost:3306/bikehub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8

# Usuário de acesso ao SGBD MySQL (ajuste conforme seu ambiente local)
spring.datasource.username=${DB_USERNAME:root}

# Senha de acesso ao SGBD MySQL
spring.datasource.password=${DB_PASSWORD:root}

# Classe do driver JDBC oficial do MySQL para Spring Boot 3
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------
# 3. CONFIGURAÇÕES DO HIBERNATE / SPRING DATA JPA
# ----------------------------------------------------------------------
# Define o dialeto SQL específico para compatibilidade com os recursos do MySQL 8.x
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Estratégia de DDL do Hibernate:
# 'update' atualiza o schema do banco de dados automaticamente com base nas anotações @Entity
# sem apagar os dados existentes (ideal para desenvolvimento)
spring.jpa.hibernate.ddl-auto=update

# Exibe os comandos SQL formatados no console da IDE para facilitar a depuração das consultas
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Permite inicialização do schema a partir do arquivo schema.sql caso desejado
spring.sql.init.mode=always

# ----------------------------------------------------------------------
# 4. CONFIGURAÇÕES DO MOTOR DE TEMPLATES THYMELEAF
# ----------------------------------------------------------------------
# Desabilita o cache de templates do Thymeleaf durante o desenvolvimento.
# Com isso, qualquer alteração em arquivos .html é refletida imediatamente no navegador ao recarregar
spring.thymeleaf.cache=false

# Prefixo padrão onde o Spring Boot buscará os arquivos de template HTML
spring.thymeleaf.prefix=classpath:/templates/

# Sufixo dos arquivos de template
spring.thymeleaf.suffix=.html

# Codificação dos templates HTML (garante acentuação correta em Português)
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ----------------------------------------------------------------------
# 5. CONFIGURAÇÕES DE LOG E AUDITORIA
# ----------------------------------------------------------------------
# Nível de log detalhado para os pacotes de negócio do BikeHub
logging.level.br.com.projeto.bikehub=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
